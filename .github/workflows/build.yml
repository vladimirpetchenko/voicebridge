name: Release

# Сборка установщиков для Windows (.exe) и macOS (.dmg).
# Запускается по тегу v* или вручную (кнопка "Run workflow" во вкладке Actions).
#
# Первая сборка долгая (~20-40 мин): whisper.cpp компилируется из исходников.
# Кэш Rust (swatinem/rust-cache) ускоряет повторные прогоны.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: macos
            artifact: src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build app
        run: npm run tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicebridge-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
