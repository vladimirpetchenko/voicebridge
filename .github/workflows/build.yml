name: Release

# Сборка установщиков для Windows (.exe), macOS (.dmg) и Android (APK).
# Запускается по тегу v* или вручную (кнопка "Run workflow" во вкладке Actions).
#
# Первая сборка долгая (~20-40 мин): whisper.cpp компилируется из исходников.
# Кэш Rust (swatinem/rust-cache) ускоряет повторные прогоны.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: macos
            artifact: src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # Ключ подписи артефактов обновления. Нужен, когда в tauri.conf.json
      # включён bundle.createUpdaterArtifacts. Секрет добавляется в
      # Settings → Secrets and variables → Actions → TAURI_SIGNING_PRIVATE_KEY.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build app
        run: npm run tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicebridge-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}

  # Мобильное приложение (Flutter) — сборка Android APK.
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Build APK
        run: flutter build apk --release
        working-directory: mobile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicebridge-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
